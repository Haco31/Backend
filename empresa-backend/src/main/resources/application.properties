spring.application.name=empresa-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.datasource.hikari.maximum-pool-sice=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

management.endpoints.web.exposure.include=metrics

spring.cloud.azure-directory.enabled=true
spring.cloud.azure-directory.profile.tenant-id=${TENANT_ID}
spring.cloud.azure-directory.credential.client-id=${CLIENT_ID}
spring.cloud.azure-directory.credential.client-secret=${CLIENT-SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

server.port=8085
