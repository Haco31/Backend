services:
  db:
    image: postgres:16
    container_name: etiquetas_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - /Users/alumno/Documents/backend/sistema_etiquetas/pgdata:/var/lib/postgresql/data

  api:
    build: ./archivos/backend/sistema-etiquetas-api
    container_name: etiquetas_api
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}